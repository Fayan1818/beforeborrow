name: checks

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: localonly
          POSTGRES_DB: bb
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          cd apps/api
          pip install -r requirements.lock
      - name: Run migrations
        run: |
          cd apps/api
          cp .env.example .env
          alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://app:localonly@localhost:5432/bb
      - name: Run tests
        run: |
          cd apps/api
          pytest tests/ -v
        env:
          DATABASE_URL: postgresql+psycopg://app:localonly@localhost:5432/bb

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: cd apps/web && npm ci
      - name: Type-check
        run: cd apps/web && npx tsc --noEmit
      - name: Unit tests
        run: cd apps/web && npx vitest run
